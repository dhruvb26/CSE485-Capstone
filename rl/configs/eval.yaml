logging:
  level: INFO

model:
  type: local
  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    max_tokens: 256
  local:
    model_name: Qwen/Qwen2.5-7B-Instruct
    max_seq_length: 2048
    load_in_4bit: true
    temperature: 0.0
    max_new_tokens: 512
    gpu_memory_utilization: 0.8
    stop_strings: []
    adapter_path: "checkpoints/grpo/adapter"

data:
  base_dir: data
  casino:
    test: casino/ca.test.csv
    train: casino/ca.train.csv
  dnd:
    test: dnd/dnd.test.csv
    train: dnd/dnd.train.csv

eval:
  n_instances: 200
  tasks:
    ca:
      - sta_total_item_count_ca
      - sta_max_points_ca
      - sta_ask_point_values_ca
      - sta_ask_high_priority_ca
      - sta_ask_low_priority_ca
      - mid_ask_high_priority_ca
      - mid_ask_low_priority_ca
      - mid_partner_ask_high_priority_ca
      - mid_partner_ask_low_priority_ca
      - mid_strategy_ca
