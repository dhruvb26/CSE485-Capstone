data: data/sft/train_hindsight.jsonl

# Only tasks listed here are trained on. Set to null to include all.
tasks: null

# Base pretrained model (HuggingFace ID or local path). Always required.
model_name: Qwen/Qwen2.5-7B-Instruct
# Path to an existing LoRA adapter to resume training from. Set to null for a fresh LoRA.
# When set, model_name must be the matching base model used when that adapter was created.
adapter_path: null
out_dir: checkpoints/sft-tuned
seed: 42

lora:
  rank: 16
  alpha: 16
  dropout: 0.05

training:
  max_seq_length: 2048
  load_in_4bit: true
  lr: 0.0002
  epochs: 2
  batch_size: 4
  grad_accum: 4
  warmup_ratio: 0.05
  save_steps: 50
