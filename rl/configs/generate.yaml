mode: api
temperature: 1
max_instances: 125

api:
  model: "gpt-5-mini-2025-08-07"
  base_url: null
  api_key_env: "OPENAI_API_KEY"
  max_retries: 5
  retry_min_wait: 2
  retry_max_wait: 60
  max_concurrent: 10

local:
  model: "Qwen/Qwen2.5-72B-Instruct"
  base_url: "http://localhost:8000/v1"
  max_retries: 3
  retry_min_wait: 1
  retry_max_wait: 10
  max_concurrent: 64

datasets:
  casino:
    path: data/casino/ca.train.csv

output_jsonl: "data/sft/train.jsonl"
