out: data/sft/train.jsonl
seed: 42
dedup: true

max_total: 2000

llm_model: gpt-4.1-mini-2025-04-14
llm_api_key_env: OPENAI_API_KEY

max_concurrency: 5

datasets:
  casino:
    path: data/casino/ca.train.csv
    tasks:
      - turn_ca
  dnd:
    path: data/dnd/dnd.train.csv
    tasks:
      - turn_dnd

llm_ratios:
  turn_ca: 1.0
  turn_dnd: 1.0

weights:
  turn_ca: 3.0
  turn_dnd: 2.0