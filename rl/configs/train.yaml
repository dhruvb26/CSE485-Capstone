model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  bias: none
  target_modules: all-linear
  task_type: CAUSAL_LM

sft:
  data_path: data/casino/train.jsonl
  output_dir: checkpoints/sft-tuned-2
  num_train_epochs: 5          
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-6        
  warmup_ratio: 0.1
  logging_steps: 5
  save_strategy: epoch
  assistant_only_loss: true
  gradient_checkpointing: true
  bf16: true
  report_to: none

