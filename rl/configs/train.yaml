model:
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  hf_home: /scratch/dbansa11/hf_models

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  bias: none
  target_modules: all-linear
  task_type: CAUSAL_LM

sft:
  data_path: data/casino/train.jsonl
  output_dir: checkpoints/sft-tuned
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 8.0e-6
  warmup_ratio: 0.1
  logging_steps: 5
  save_strategy: epoch
  assistant_only_loss: true
  gradient_checkpointing: true
  bf16: true
  report_to: trackio

# resume_from: null    # set to a checkpoint path or "latest"
