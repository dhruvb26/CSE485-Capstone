data_path: "data/sft/train.jsonl"
val_split: 0.0
resume_from: null

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  hf_home: "/scratch/dbansa11/hf_models"
  dtype: "bfloat16"

sft:
  output_dir: "checkpoints/sft-tuned"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 4
  learning_rate: 8.0e-6
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 5
  save_steps: 50
  eval_strategy: "no"
  max_length: 2048
  assistant_only_loss: true
  eos_token: "<|im_end|>"
  bf16: true
  tf32: true
  gradient_checkpointing: true
  packing: false

lora:
  r: 4
  lora_alpha: 8
  lora_dropout: 0.2
  bias: "none"
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"