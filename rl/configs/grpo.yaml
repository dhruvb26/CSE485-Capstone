# mode: "self_play" or "annotated"
#   - self_play: generates episodes via model self-play, then trains with GRPO
#   - annotated: uses pre-annotated JSONL conversations as GRPO prompts

mode: annotated

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  hf_home: /scratch/dbansa11/hf_models

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  bias: none
  target_modules: all-linear
  task_type: CAUSAL_LM

grpo:
  sft_checkpoint: checkpoints/sft-tuned
  output_dir: checkpoints/grpo
  prompt_split: 0.6
  num_generations: 4
  beta: 0.04
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-7
  warmup_ratio: 0.1
  logging_steps: 10
  save_strategy: "epoch"
  gradient_checkpointing: true
  bf16: true
  report_to: trackio
  
  # for annotated mode
  data_path: data/casino/train.jsonl

  extra_kwargs:
    log_completions: true

