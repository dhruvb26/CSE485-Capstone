# mode: "self_play" or "annotated"
#   - self_play: generates episodes via model self-play, then trains with GRPO
#   - annotated: uses pre-annotated JSONL conversations as GRPO prompts

mode: self_play

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  bias: none
  target_modules: all-linear
  task_type: CAUSAL_LM

judge:
  model: anthropic/claude-haiku-4.5
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

grpo:
  sft_checkpoint: checkpoints/sft-tuned
  output_dir: checkpoints/grpo-selfplay
  prompt_split: 0.6
  num_generations: 8
  beta: 0.0
  num_online_iterations: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-6
  warmup_ratio: 0.1
  logging_steps: 10
  save_strategy: "no"
  gradient_checkpointing: true
  bf16: true
  report_to: trackio

  csv_path: data/casino/train.csv
  num_episodes: 200
  max_turns: 18
  temperature: 0.7
  top_p: 0.9
  persona_weights:
    uncompromising: 0.25
    selfish: 0.25
    anchoring: 0.25
    cooperative: 0.25

  extra_kwargs:
    generation_batch_size: 8
    log_completions: true
    loss_type: "dr_grpo"
    scale_rewards: false
    max_completion_length: 512

  # for annotated mode (uncomment and switch mode above to use)
  # data_path: data/casino/train.jsonl

# resume_from: null
