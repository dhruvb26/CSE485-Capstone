grpo:
  candidates_per_turn: 8
  max_turns: 6
  clone_sync_interval: 25
  kl_coeff: 0.3
  terminal_lambda: 0.4
  walkaway_penalty: -0.2
  base_model: mistralai/Mistral-7B-Instruct-v0.3
  sft_adapter_path: checkpoints/sft-tuned/adapter
  out_dir: checkpoints/grpo
  seed: 42
  temperature: 0.7
  resume_from: null
  lora:
    rank: 64
    alpha: 64
    dropout: 0.05
  training:
    max_seq_length: 2048
    load_in_4bit: true
    lr: 0.00002
    grad_accum: 8
    warmup_ratio: 0.05
    save_steps: 25

reward:
  terminal_weight: 0.50
  format_weight: 0.15
  arithmetic_weight: 0.15
  strategy_weight: 0.10
  partner_model_weight: 0.10
  action_quality_weight: 0.20
  decay_window: 1000
  strategy_classifier_path: checkpoints/strategy-classifier
