mode: self_play

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules: all-linear
  task_type: CAUSAL_LM

judge:
  model: anthropic/claude-haiku-4.5
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

grpo:
  checkpoint: checkpoints/grpo-annotated-0411-1/checkpoint-1200
  opponent_checkpoint: checkpoints/grpo-annotated-0411-1/checkpoint-1200
  output_dir: checkpoints/grpo-selfplay-0412-1
  prompt_split: 0.8
  num_generations: 8
  beta: 0.0
  num_online_iterations: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-6
  warmup_ratio: 0.1
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 2
  gradient_checkpointing: true
  bf16: true
  report_to: none
  dataset_cache_dir: /scratch/dbansa11/data/capstone/selfplay-cache-0412
  csv_path: data/casino/train.csv
  num_episodes: 800
  max_turns: 18
  temperature: 0.7
  top_p: 0.9
  persona_weights:
    uncompromising: 0.25
    selfish: 0.25
    anchoring: 0.25
    cooperative: 0.25

  extra_kwargs:
    generation_batch_size: 8
    log_completions: true
    loss_type: "dr_grpo"
    scale_rewards: false
    max_completion_length: 512
    max_grad_norm: 1.0
    temperature: 1.2
    epsilon: 0.2
    epsilon_high: 0.28
