data: data/sft/train.jsonl

# Only tasks listed here are trained on. Set to null to include all.
# Phase 1 (format SFT): sta_* only — lock in schema compliance before adding task reasoning.
# Once valid/total ≈ 1.0 on sta_* eval, add mid_* tasks for phase 2.
tasks: null

# Base pretrained model (HuggingFace ID or local path). Always required.
model_name: unsloth/mistral-7b-instruct-v0.3
# Path to an existing LoRA adapter to resume training from. Set to null for a fresh LoRA.
# When set, model_name must be the matching base model used when that adapter was created.
adapter_path: null
out_dir: checkpoints/sft-tuned
seed: 42

# Lower rank is sufficient for format-only SFT; bump to 64 for the full mid_* training run.
lora:
  rank: 64
  alpha: 32
  dropout: 0.05

training:
  max_seq_length: 2048
  load_in_4bit: true
  lr: 0.0002
  epochs: 2
  batch_size: 4
  grad_accum: 4
  warmup_ratio: 0.05
  save_steps: 50
