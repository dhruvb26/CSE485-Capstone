grpo:
  candidates_per_turn: 8
  max_turns: 10
  clone_sync_interval: 300
  kl_coeff: 0.1
  terminal_lambda: 0.4
  walkaway_penalty: -0.2
  base_model: unsloth/mistral-7b-instruct-v0.3
  sft_adapter_path: checkpoints/sft-mid/adapter
  out_dir: checkpoints/grpo
  seed: 42
  lora:
    rank: 32
    alpha: 16
    dropout: 0.05
  training:
    max_seq_length: 2048
    load_in_4bit: true
    lr: 0.00005
    epochs: 1
    batch_size: 1
    grad_accum: 8
    warmup_ratio: 0.05
    save_steps: 100

reward:
  terminal_weight: 0.50
  format_weight: 0.15
  arithmetic_weight: 0.15
  strategy_weight: 0.10
  partner_model_weight: 0.10
  decay_window: 1000
  strategy_classifier_path: checkpoints/strategy-classifier
