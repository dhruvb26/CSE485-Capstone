out: data/sft/train.jsonl
seed: 42
dedup: true

max_total: 1000

llm_model: gpt-4o-mini
llm_api_key_env: OPENAI_API_KEY

# Max parallel OpenAI API calls
max_concurrency: 30

# Turn-only SFT: all examples teach the {thought, talk, action} JSON schema.
datasets:
  casino:
    path: data/casino/ca.train.csv
    tasks:
      - turn_ca
  dnd:
    path: data/dnd/dnd.train.csv
    tasks:
      - turn_dnd
  craigslist:
    path: data/formatted/craigslist_bargains_alpaca.jsonl
    tasks:
      - turn_cl

llm_ratios:
  turn_ca: 0.4
  turn_dnd: 0.2
  turn_cl: 0.2

weights:
  turn_ca: 3.0
  turn_dnd: 2.0
  turn_cl: 2.0
