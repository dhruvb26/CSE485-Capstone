csv_path: data/casino/ca.test.csv
num_episodes: 200
max_turns: 18
temperature: 0.7
top_p: 0.9
seed: 42
output_dir: logs/negotiate-0412-1

persona_weights:
  uncompromising: 0.25
  selfish: 0.25
  anchoring: 0.25
  cooperative: 0.25

matchups:
  # GRPO cp1200 as learner vs SFT opponent
  - learner:
      label: grpo-annotated-cp1200
      model_path: checkpoints/grpo-annotated-0411-1/checkpoint-1200
      base_model: Qwen/Qwen2.5-7B-Instruct
    opponent:
      label: sft-tuned-2
      model_path: checkpoints/sft-tuned-2
      base_model: Qwen/Qwen2.5-7B-Instruct

  # Flipped: SFT as learner vs GRPO cp1200 opponent
  - learner:
      label: sft-tuned-2
      model_path: checkpoints/sft-tuned-2
      base_model: Qwen/Qwen2.5-7B-Instruct
    opponent:
      label: grpo-annotated-cp1200
      model_path: checkpoints/grpo-annotated-0411-1/checkpoint-1200
      base_model: Qwen/Qwen2.5-7B-Instruct

  # Control: SFT vs SFT
  - learner:
      label: sft-tuned-2
      model_path: checkpoints/sft-tuned-2
      base_model: Qwen/Qwen2.5-7B-Instruct
    opponent:
      label: sft-tuned-2
      model_path: checkpoints/sft-tuned-2
      base_model: Qwen/Qwen2.5-7B-Instruct

  # Reference: Qwen base vs SFT
  - learner:
      label: qwen-base
      model_path: Qwen/Qwen2.5-7B-Instruct
    opponent:
      label: sft-tuned-2
      model_path: checkpoints/sft-tuned-2
      base_model: Qwen/Qwen2.5-7B-Instruct
