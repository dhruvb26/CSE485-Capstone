models:
  - type: vllm_model
    model_str: Qwen/Qwen3-4B-Instruct-2507
    base_url: http://localhost:8000/v1
    max_tokens: 2048
    token_limit: 8192
    label: qwen3-4b-instruct-2507

num_instances: 200
max_num_instances: 200
use_cot: true             # structured reasoning with <answer> extraction
num_multishot: 0          # number of multishot examples (0 or 2)
num_prior_utts: 0         # prior utterances as context (0 = none)
num_utts_partial_dial: -1 # partial dialogue length (-1 = full)

storage_dir: ./logs/eval/tasks
evaluate_only: false

tasks:
  - sta_total_item_count_dnd
  - sta_max_points_dnd
  - sta_ask_point_values_dnd
  - mid_dial_act_dnd
  - mid_full_proposal_dnd
  - end_deal_specifics_dnd
  - end_deal_total_dnd
  - sta_total_item_count_ca
  - sta_max_points_ca
  - sta_ask_point_values_ca
  - sta_ask_low_priority_ca
  - sta_ask_high_priority_ca
  - mid_strategy_ca
  - mid_ask_low_priority_ca
  - mid_ask_high_priority_ca
  - mid_partner_ask_low_priority_ca
  - mid_partner_ask_high_priority_ca
  - end_deal_specifics_ca
  - end_deal_total_ca
  - end_deal_likeness_ca
  - end_deal_satisfaction_ca
  - end_partner_deal_likeness_ca
  - end_partner_deal_satisfaction_ca
  - sta_ask_high_priority_ji_w
  - sta_ask_low_priority_ji_w
  - mid_ask_high_priority_ji_w
  - mid_ask_low_priority_ji_w
  - mid_partner_ask_high_priority_ji_w
  - mid_partner_ask_low_priority_ji_w
  - mid_dial_act_ji
  - end_deal_specifics_ji
  - mid_dial_act_cra
  - mid_full_proposal_cra
