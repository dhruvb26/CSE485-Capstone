models:
  - type: open_ai
    model_str: gpt-4o-mini-2024-07-18

#  - type: open_ai
#    model_str: gpt-4o-2024-08-06
#  - type: hf_model
#    model_str: mistralai/Mistral-7B-Instruct-v0.1
#  - type: local_model
#    model_path: checkpoints/grpo-tuned       # checkpoint dir or HF hub name
#    base_model: Qwen/Qwen2.5-3B-Instruct    # required if model_path is a LoRA adapter
#    label: my-grpo-model                     # optional display name for log files
#    max_new_tokens: 256                      # generation length (default: 256)
#    token_limit: 4096                        # max input tokens (default: 4096)

# DealOrNoDeal (dnd):
#   sta_total_item_count_dnd, sta_max_points_dnd, sta_ask_point_values_dnd,
#   mid_dial_act_dnd, mid_gen_resp_dnd, mid_full_proposal_dnd,
#   end_deal_specifics_dnd, end_deal_total_dnd
#
# CaSiNo (casino):
#   sta_total_item_count_ca, sta_max_points_ca, sta_ask_point_values_ca,
#   sta_ask_low_priority_ca, sta_ask_high_priority_ca,
#   mid_strategy_ca, mid_gen_resp_ca, mid_ask_low_priority_ca,
#   mid_ask_high_priority_ca, mid_partner_ask_low_priority_ca,
#   mid_partner_ask_high_priority_ca,
#   end_deal_specifics_ca, end_deal_total_ca, end_deal_likeness_ca,
#   end_deal_satisfaction_ca, end_partner_deal_likeness_ca,
#   end_partner_deal_satisfaction_ca
#
# JobInterview (job_interview):
#   sta_ask_high_priority_ji_w, sta_ask_low_priority_ji_w,
#   mid_ask_high_priority_ji_w, mid_ask_low_priority_ji_w,
#   mid_partner_ask_high_priority_ji_w, mid_partner_ask_low_priority_ji_w,
#   mid_dial_act_ji, end_deal_specifics_ji
#
# CRA (cra):
#   mid_dial_act_cra, mid_full_proposal_cra
#
# Use "all" to run every task, or "all_dnd", "all_casino", etc. for a dataset.
tasks:
  - sta_total_item_count_dnd
  - sta_max_points_dnd
  - end_deal_specifics_dnd
  - sta_total_item_count_ca
  - end_deal_specifics_ca

num_instances: 200       
max_num_instances: 200   

use_cot: false            # chain-of-thought prompting
num_multishot: 0          # number of multishot examples (0 or 2)
num_prior_utts: 0         # prior utterances as context (0 = none)
num_utts_partial_dial: -1 # partial dialogue length (-1 = full)

storage_dir: ./logs/eval
evaluate_only: false  
