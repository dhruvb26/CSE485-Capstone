[project]
name = "asu-ai-negotiation-agent"
version = "0.0.0"
description = "Post-run analysis tooling for negotiation-agent training"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "trackio",
    "matplotlib",
    "pandas",
    "numpy",
    "huggingface-hub",
    "pyyaml",
    "loguru",
    "rich",
    "datasets>=4.8.4",
    "tinker-cookbook>=0.3.0",
    "python-dotenv>=1.2.2",
    "wandb>=0.26.0",
    "weave>=0.52.37",
]

[project.optional-dependencies]
eval = [
    "openai",
    "tiktoken",
    "scikit-learn",
    "python-dotenv",
    "requests",
    "tqdm",
    "pydantic>=2,<3",
]

[tool.uv]
dev-dependencies = ["ipython"]
